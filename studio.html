<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f5ef"><title>STUDIO｜麋鹿斑斑 V5.0.2</title>
<style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#f4f5ef;color:#303d36;font:15px/1.6 system-ui,-apple-system,"Noto Sans TC",sans-serif}main{max-width:960px;margin:auto;padding:16px 14px 48px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:12px 0}h1{font-size:29px;letter-spacing:-.05em;margin:0}h2{font-size:21px;margin:5px 0 14px}h3{font-size:16px;margin:16px 0 8px}small,p{color:#52685c}.card{background:#fffdfa;border:1px solid #dce4da;border-radius:18px;padding:18px;margin:12px 0;min-width:0;overflow-wrap:anywhere}button,input,textarea,select{font:inherit;color:#303d36}button{border:1px solid #d4ded4;background:#fffdfa;border-radius:12px;min-height:44px;padding:10px 14px;cursor:pointer;touch-action:manipulation}button.primary{background:#303d36;color:#fff;border-color:#303d36}button:disabled{opacity:.55}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #789488;outline-offset:2px}label{display:block;margin:10px 0}input:not([type=checkbox]),textarea,select{width:100%;min-height:44px;border:1px solid #cbd9cd;border-radius:10px;padding:10px;font-size:16px;background:white}input[type=checkbox]{width:23px;height:23px;vertical-align:middle;accent-color:#547663}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions>*{flex:1;min-width:100px}.status{border-radius:12px;background:#e1ebe0;padding:10px 12px;margin:8px 0;white-space:pre-wrap}.status.error{background:#f3dce0;color:#743b46}.order{display:block;width:100%;text-align:left;margin:6px 0;overflow-wrap:anywhere}.status-choices{display:flex;gap:7px;flex-wrap:wrap}.status-choices button{flex:1 1 90px;min-height:44px}.status-choices button[aria-pressed=true]{background:#303d36;color:white;border-color:#303d36}.order span{display:block;font-size:12px;color:#52685c}.pill{display:inline-block;border-radius:99px;background:#e1ebe0;color:#405b4b;padding:4px 10px;font-size:12px}.grid{display:grid;grid-template-columns:minmax(200px,1fr) minmax(0,1.5fr);gap:12px}.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.chip{display:inline-block;width:25px;height:25px;border-radius:50%;border:1px solid #303d3630;vertical-align:middle;margin-right:7px}.checkrow{display:flex;align-items:center;gap:8px;min-height:46px;border-bottom:1px solid #e6ebe3}.checkrow span{flex:1;overflow-wrap:anywhere}.checkrow input{flex:none}dialog{border:0;border-radius:20px;padding:20px;background:#fffdfa;color:#303d36;width:min(430px,calc(100% - 24px));max-height:calc(100dvh - 24px)}dialog::backdrop{background:#263b305e}#login{max-width:460px;margin:25px auto}#pubPreview{white-space:pre-wrap;font-size:13px}a{color:#436b57}@media(max-width:700px){.grid,.checks{grid-template-columns:1fr}.card{padding:13px}main{padding-bottom:max(24px,env(safe-area-inset-bottom,0px))}#detail:not([hidden])~*{min-width:0}dialog{width:100%;max-width:100%;margin:auto 0 0;border-radius:22px 22px 0 0;padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}}@media(max-width:380px){header{flex-wrap:wrap}.actions>*{min-width:0}} 
.production{margin:12px 0;padding:12px;background:#f0f3eb;border-radius:16px;min-width:0}.production-tools{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.production-tools button{flex:1;min-width:0;padding:8px 5px;font-size:13px}.production-tools button[aria-pressed=true]{background:#303d36;color:white}.production-art{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.production-art.single{grid-template-columns:1fr}.production-art figure{margin:0;min-width:0;background:#fffdfa;border-radius:12px;padding:8px;text-align:center}.production-art svg{display:block;width:100%;height:clamp(160px,35vh,360px)}.production-art.single svg{height:clamp(230px,43vh,500px)}.production-art figcaption{font-size:12px;color:#52685c}.production-pigments{display:flex;gap:8px;overflow-x:auto;max-width:100%;padding:4px;min-width:0}.production-pigments button{flex:none;min-width:70px;font-size:12px}.production-pigments button[aria-pressed=true]{border:2px solid #547663;background:#e1ebe0}.production-pigments i{display:block;margin:0 auto 3px}.production-info{font-size:12px;color:#52685c}.grid:has(#detail.focus-mode){display:block}.grid:has(#detail.focus-mode)>section:first-child,#detail.focus-mode #orderForm,#detail.focus-mode .detail-normal,#detail.focus-mode #receipt{display:none!important}body:has(#detail.focus-mode) #publish{display:none!important}#detail.focus-mode .production-art svg{height:clamp(260px,55vh,650px)}#detail.focus-mode .production{padding:8px}#detail.focus-mode .checks{grid-template-columns:1fr}.checkrow .pigment-label{border:0;background:transparent;flex:1;text-align:left;min-width:0;padding:5px}.checkrow .pigment-label span{overflow-wrap:anywhere}@media(max-width:700px){.grid:has(#detail:not([hidden]))>section:first-child{display:none}.production{padding:8px}.production-art svg{height:190px}.production-art.single svg{height:clamp(230px,43vh,420px)}#detail.focus-mode .production-art svg{height:clamp(240px,50vh,500px)}}
#photoPreview{display:block;width:100%;max-width:420px;border-radius:12px;margin:8px 0}#photoInfo{font-size:13px}#qcPhoto{border-top:1px solid #e0e6de;margin-top:12px;padding-top:4px}
</style></head><body><main>
<header><div><small>MILU BANBAN · STUDIO 5.0.2</small><h1>STUDIO</h1></div><div id="session" hidden><span id="role" class="pill"></span> <button id="logout">登出</button></div></header>
<div id="notice" class="status" role="status" hidden></div>
<section id="login" class="card"><h2>登入工作室</h2><p>限已授權的管理員與員工。此版本需要正式雲端資料庫設定。</p><form id="loginForm"><label>電子郵件<input id="email" type="email" autocomplete="username" required maxlength="254"></label><label>密碼<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><button class="primary" type="submit">登入</button></form><p><a href="/">返回顧客創作端</a></p></section>
<section id="app" hidden><div class="grid"><section class="card"><h2>客製製作單</h2><div class="actions"><button id="reload">重新整理</button><button id="prev">上一頁</button><button id="next">下一頁</button></div><p id="pageInfo"></p><div id="orders"></div></section>
<section class="card" id="detail" hidden><h2 id="title">製作單</h2><p id="receipt"></p><div class="actions detail-normal"><button id="download">下載原始製作設計檔</button><button id="closeDetail">返回列表</button></div><section class="production" id="production" aria-label="製作視圖"><div class="production-tools"><button id="focusProduction">專注製作</button><button id="wakeProduction" hidden>保持螢幕亮起</button></div><div class="production-tools" id="viewChoices"></div><div class="production-tools" id="earChoices"></div><div class="production-pigments" id="productionPigments" hidden></div><div class="production-art" id="productionArt"></div><label id="replayLabel" hidden>手繪順序參考 <span id="replayCount"></span><input type="range" id="replay" min="0" max="0"></label><p class="production-info">分色按畫面色碼辨識，相同色碼會一起顯示；手繪回放並非實際上色工序。</p><div class="actions" id="focusSaveRow" hidden><button class="primary" id="focusSave">儲存上色進度</button></div></section><div id="checks" class="checks"></div><form id="orderForm"><div><h3>製作進度</h3><input type="hidden" id="orderStatus"><div id="statusChoices" class="status-choices" role="group" aria-label="製作進度"></div></div><label>訂單參考編號<input id="ref" maxlength="80"></label><label>負責人<input id="assignee" maxlength="60"></label><label>預計完成日<input id="due" type="date"></label><label>製作備註<textarea id="note" rows="4" maxlength="3000"></textarea></label><label><input id="qc" type="checkbox"> 已完成品質確認</label><section id="qcPhoto"><h3>成品照片</h3><p id="photoInfo">尚未載入照片。</p><img id="photoPreview" alt="成品照片" hidden><label>拍攝或選擇照片<input id="photoFile" type="file" accept="image/*"></label><button id="photoRemove" type="button" hidden>移除成品照片</button><p>照片會縮小至長邊 720px，僅工作室成員可查看。</p></section><div class="actions"><button type="submit" class="primary">儲存雲端製作進度</button></div></form></section></div>
<section id="publish" class="card" hidden><h2>發布工作室色票</h2><p>管理者專用。選擇 V4.7 工作室完整備份 JSON，僅發布色票及已發布版型，不會傳送備份中的製作單、照片或備註。所有啟用顏料均須填入實體編號。</p><label>選擇備份<input id="paletteFile" type="file" accept=".json,application/json"></label><p id="pubPreview"></p><button class="primary" id="publishBtn" disabled>發布新版色票</button></section>
</section></main>
<dialog id="confirmDlg"><h2 id="confirmTitle"></h2><p id="confirmText"></p><div class="actions"><button id="confirmNo">取消</button><button id="confirmYes" class="primary">確認</button></div></dialog>
<script src="/studio-render.js"></script>
<script src="/render-v2-material.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),statuses=['待確認','等待製作','製作中','品質檢查','已完成'];let token='',role='',selected=null,publishData=null,offset=0,nextOffset=null,busy=false,dirty=false,renderer=null,prodEar='both',prodView='normal',prodPigment='',prodStep=-1,focusMode=false,wake=null;
const el=(tag,txt,cls)=>{const x=document.createElement(tag);if(txt!==undefined)x.textContent=txt;if(cls)x.className=cls;return x};
function msg(t,err=false){$('notice').hidden=!t;$('notice').textContent=t;$('notice').classList.toggle('error',err)}
async function api(action,body,query=''){const r=await fetch('/api/studio?action='+encodeURIComponent(action)+query,{method:body===undefined?'GET':'POST',cache:'no-store',headers:{...(token?{Authorization:'Bearer '+token}:{}),...(body===undefined?{}:{'Content-Type':'application/json'})},...(body===undefined?{}:{body:JSON.stringify(body)})});const d=await r.json();if(!r.ok){if((r.status===401||r.status===403)&&action!=='login'){if(action!=='publish')endSession()}throw Error(d.error||'操作失敗')}return d}
function ask(title,text,yes='確認'){return new Promise(resolve=>{const d=$('confirmDlg');$('confirmTitle').textContent=title;$('confirmText').textContent=text;$('confirmYes').textContent=yes;let done=false;const close=v=>{if(done)return;done=true;d.close();resolve(v)};$('confirmNo').onclick=()=>close(false);$('confirmYes').onclick=()=>close(true);d.oncancel=e=>{e.preventDefault();close(false)};d.showModal();$('confirmNo').focus()})}
function endSession(){resetProduction();token='';role='';selected=null;publishData=null;dirty=false;$('session').hidden=true;$('app').hidden=true;$('login').hidden=false;$('password').value='';$('detail').hidden=true;$('publish').hidden=true;$('orders').replaceChildren();$('checks').replaceChildren();$('receipt').textContent='';$('title').textContent='製作單';$('orderForm').reset();$('paletteFile').value='';$('pubPreview').textContent='';$('publishBtn').disabled=true}
async function canLeave(){return !dirty||await ask('離開未儲存的製作單？','尚未儲存的進度與備註會被放棄。','放棄變更')}
async function run(fn){if(busy)return;busy=true;try{await fn()}catch(e){msg(e.message,true)}finally{busy=false}}
$('loginForm').addEventListener('submit',e=>{e.preventDefault();run(async()=>{const d=await api('login',{email:$('email').value.trim(),password:$('password').value});token=d.accessToken;role=d.role;$('password').value='';$('login').hidden=true;$('app').hidden=false;$('session').hidden=false;$('role').textContent=role==='owner'?'管理者':'員工';$('publish').hidden=role!=='owner';offset=0;msg('已登入雲端工作室');await list()})});
async function list(){const d=await api('orders',undefined,'&offset='+offset);nextOffset=d.next;$('orders').replaceChildren();$('pageInfo').textContent='第 '+(Math.floor(offset/50)+1)+' 頁 · '+d.orders.length+' 張製作單';$('prev').disabled=offset===0;$('next').disabled=nextOffset===null;for(const o of d.orders){const b=el('button',undefined,'order');b.append(el('b',o.ref||o.receipt),el('span',o.status+' · '+(o.assignee||'未分派')+' · '+new Date(o.created_at).toLocaleDateString('zh-TW')));b.onclick=()=>run(async()=>{if(await canLeave())await open(o.id)});$('orders').append(b)}if(!d.orders.length)$('orders').append(el('p','目前沒有製作單'))}
function colors(d,ear){const s=ear==='right'&&!d.same?d.right:d.left,ids=new Set([s.cols[0]]),rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));for(const [k,v] of Object.entries(s.zones||{})){if(k==='centerForehead'&&s.join!=='bridge'||k==='muzzle'&&!s.muzzle||k.endsWith('Cheek')&&s.finish==='soft')continue;ids.add(s.cols[Math.min(v,s.mode-1)])}for(const x of s.drawing||[])if(x.tool!=='erase')ids.add(x.color);if(s.stripe){const id=s.cols[Math.min(s.zones[s.join==='bridge'?'centerForehead':'leftForehead'],s.mode-1)],main=d.palette.find(p=>p.id===id);if(main){const target=rgb(main.hex).map((v,i)=>Math.round(v*.35+rgb('#2b211c')[i]*.65));const nearest=d.palette.filter(p=>p.enabled!==false).slice().sort((a,b)=>{const dist=p=>rgb(p.hex).reduce((t,v,i)=>t+(v-target[i])**2,0);return dist(a)-dist(b)})[0];if(nearest)ids.add(nearest.id)}}return d.palette.filter(p=>ids.has(p.id))}
function releaseWake(){if(wake){const old=wake;wake=null;old.release().catch(()=>{})}$('wakeProduction').textContent='保持螢幕亮起'}
function setFocusMode(yes){focusMode=yes;$('detail').classList.toggle('focus-mode',yes);$('focusProduction').textContent=yes?'離開專注製作':'專注製作';$('wakeProduction').hidden=!yes;$('focusSaveRow').hidden=!yes;if(yes){prodEar='left';prodView='flat';prodStep=-1}else releaseWake();drawProduction();if(yes)$('production').scrollIntoView({block:'start'})}
function productionChoices(host,items,value,fn){host.replaceChildren(...items.map(([id,label])=>{const b=el('button',label);b.type='button';b.setAttribute('aria-pressed',String(id===value));b.onclick=()=>fn(id);return b}))}
function drawProduction(){if(!selected||!renderer)return;const d=selected.design,ears=prodEar==='both'?['left','right']:[prodEar];productionChoices($('viewChoices'),[['normal','成品'],['flat','平面'],['color','分色'],['grid','格線']],prodView,v=>{prodView=v;if(v==='normal')prodStep=-1;drawProduction()});productionChoices($('earChoices'),[['both','雙耳'],['left','左耳'],['right','右耳']],prodEar,v=>{prodEar=v;prodStep=-1;drawProduction()});const pigments=[...new Map(ears.flatMap(e=>colors(d,e)).map(p=>[p.id,p])).values()];if(!pigments.some(p=>p.id===prodPigment))prodPigment=pigments[0]?.id||'';$('productionPigments').hidden=prodView!=='color';$('productionPigments').replaceChildren(...pigments.map(p=>{const b=el('button');b.type='button';b.setAttribute('aria-pressed',String(p.id===prodPigment));const chip=el('i',undefined,'chip');chip.style.background=p.hex;b.append(chip,el('span',p.name+' · '+(p.code||'待編號')));b.onclick=()=>{prodPigment=p.id;drawProduction()};return b}));const art=$('productionArt');art.classList.toggle('single',ears.length===1);art.replaceChildren();try{for(const ear of ears){const figure=el('figure');figure.append(prodView==='normal'&&(prodEar==='both'||prodStep<0)
 ? CatMaterialV2.render(renderer,ear,'sculpted','cloud-'+ear)
 : renderer.render(ear,prodView==='normal'?'flat':prodView,prodPigment,prodEar==='both'?-1:prodStep,'cloud-'+ear),el('figcaption',ear==='left'?'左耳環':'右耳環'));art.append(figure)}}catch(e){art.replaceChildren(el('p','製作圖無法顯示，請下載原始設計檔。'));msg(e.message,true)}const st=prodEar==='right'&&!d.same?d.right:d.left,max=(st.drawing||[]).length;$('replayLabel').hidden=prodEar==='both'||max===0;$('replay').max=max;$('replay').value=prodStep<0?max:Math.min(max,prodStep);$('replayCount').textContent=$('replay').value+' / '+max;}
$('focusProduction').onclick=()=>setFocusMode(!focusMode);
$('focusSave').onclick=()=>$('orderForm').requestSubmit();
$('replay').oninput=()=>{prodStep=Number($('replay').value);drawProduction()};
$('wakeProduction').onclick=async()=>{if(wake){releaseWake();return}if(!navigator.wakeLock){msg('此裝置不支援保持螢幕亮起',true);return}try{wake=await navigator.wakeLock.request('screen');const held=wake;held.addEventListener('release',()=>{if(wake===held){wake=null;$('wakeProduction').textContent='保持螢幕亮起'}});$('wakeProduction').textContent='停止保持亮起'}catch(_){msg('目前無法保持螢幕亮起',true)}};
function resetProduction(){clearPhoto();releaseWake();focusMode=false;renderer=null;prodEar='both';prodView='normal';prodStep=-1;prodPigment='';$('detail').classList.remove('focus-mode');$('focusProduction').textContent='專注製作';$('wakeProduction').hidden=true;$('focusSaveRow').hidden=true;$('productionArt').replaceChildren();$('productionPigments').replaceChildren();}

function clearPhoto(){ $('photoPreview').removeAttribute('src');$('photoPreview').hidden=true;$('photoRemove').hidden=true;$('photoFile').value='';$('photoInfo').textContent='尚未載入照片。';}
async function loadPhoto(id){clearPhoto();try{const r=await api('photo',undefined,'&id='+encodeURIComponent(id));if(selected?.id!==id)return;if(r.photo&&/^data:image\/jpeg;base64,[A-Za-z0-9+/=]+$/.test(r.photo)){$('photoPreview').src=r.photo;$('photoPreview').hidden=false;$('photoRemove').hidden=false;$('photoInfo').textContent='成品照片已儲存'}else $('photoInfo').textContent='尚未上傳成品照片。'}catch(e){$('photoInfo').textContent='照片暫時無法載入：'+e.message}}
async function encodePhoto(file){if(file.size>20000000)throw Error('照片不得超過 20MB');const u=URL.createObjectURL(file);try{const image=new Image();await new Promise((ok,no)=>{image.onload=ok;image.onerror=()=>no(Error('照片格式無法讀取'));image.src=u});const scale=Math.min(1,720/Math.max(image.naturalWidth,image.naturalHeight)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(image.naturalWidth*scale));c.height=Math.max(1,Math.round(image.naturalHeight*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(image,0,0,c.width,c.height);const jpg=c.toDataURL('image/jpeg',.7);if(jpg.length>700000)throw Error('照片仍過大，請選用較小照片');return jpg}finally{URL.revokeObjectURL(u)}}
async function storePhoto(photo){const order=selected;if(!order)return;const result=await api('photo',{id:order.id,revision:order.revision,photo});if(selected?.id===order.id){selected.revision=result.revision;await loadPhoto(order.id)}await list();msg(photo?'成品照片已儲存':'成品照片已移除')}
$('photoFile').onchange=()=>run(async()=>{const f=$('photoFile').files[0];if(!f||!selected)return;try{const data=await encodePhoto(f);await storePhoto(data)}finally{$('photoFile').value=''}});
$('photoRemove').onclick=()=>run(async()=>{if(selected&&await ask('移除成品照片？','照片將從雲端移除，原始設計與製作單不會刪除。','移除'))await storePhoto(null)});

async function open(id){const same=selected?.id===id;selected=await api('order',undefined,'&id='+encodeURIComponent(id));if(!same)resetProduction();try{renderer=StudioRender50.create(selected.design)}catch(e){renderer=null;msg('製作圖格式不符：'+e.message,true)}dirty=false;$('detail').hidden=false;$('title').textContent=selected.design.title||'未命名貓咪';$('receipt').textContent=selected.receipt+' · '+selected.design.code;for(const k of ['ref','note','assignee','due'])$(k).value=selected[k]||'';$('qc').checked=selected.qc;const ss=$('orderStatus');ss.value=selected.status;$('statusChoices').replaceChildren(...statuses.map(s=>{const b=el('button',s);b.type='button';b.setAttribute('aria-pressed',String(s===ss.value));b.onclick=()=>{ss.value=s;for(const x of $('statusChoices').children)x.setAttribute('aria-pressed',String(x===b));dirty=true};return b}));$('checks').replaceChildren();for(const ear of ['left','right']){const box=el('div');box.append(el('h3',ear==='left'?'左耳顏料確認':'右耳顏料確認'));for(const p of colors(selected.design,ear)){const row=el('label',undefined,'checkrow'),chip=el('i',undefined,'chip');chip.style.background=p.hex;const cb=el('input');cb.type='checkbox';cb.setAttribute('aria-label',(ear==='left'?'左耳':'右耳')+p.name+'已確認');cb.dataset.ear=ear;cb.dataset.color=p.id;cb.checked=(selected.checks?.[ear]||[]).includes(p.id);const pb=el('button',undefined,'pigment-label');pb.type='button';pb.append(chip,el('span',p.name+' · '+(p.code||'待編號')));pb.onclick=()=>{prodEar=ear;prodView='color';prodPigment=p.id;prodStep=-1;drawProduction()};row.append(pb,cb);box.append(row)}$('checks').append(box)}$('checks').append(el('p','顏料清單可能包含被覆蓋的底層色；請以本機分色視圖人工確認。'));drawProduction();await loadPhoto(id);if(innerWidth<=700&&!same)$('detail').scrollIntoView({block:'start'})}
$('orderForm').addEventListener('input',()=>dirty=true);$('checks').addEventListener('change',()=>dirty=true);
$('orderForm').addEventListener('submit',e=>{e.preventDefault();run(async()=>{if(!selected)return;const checks={left:[],right:[]};for(const cb of $('checks').querySelectorAll('input:checked'))checks[cb.dataset.ear].push(cb.dataset.color);const b={id:selected.id,revision:selected.revision,status:$('orderStatus').value,ref:$('ref').value.trim(),note:$('note').value,assignee:$('assignee').value.trim(),due:$('due').value||null,checks,qc:$('qc').checked};if(b.status==='已完成'&&!b.qc)throw Error('請先確認成品品質');await api('update',b);dirty=false;await open(selected.id);await list();msg('製作進度已儲存')})});
$('download').onclick=()=>{if(!selected)return;const u=URL.createObjectURL(new Blob([JSON.stringify(selected.design)],{type:'application/json'})),a=el('a');a.href=u;a.download=selected.receipt+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000)};
$('closeDetail').onclick=()=>run(async()=>{if(await canLeave()){dirty=false;resetProduction();selected=null;$('detail').hidden=true}});
$('reload').onclick=()=>run(async()=>{
 if(!await canLeave())return;
 await list();
 dirty=false;
 resetProduction();
 selected=null;
 $('detail').hidden=true;
 msg('');
});
$('prev').onclick=()=>run(async()=>{if(await canLeave()){offset=Math.max(0,offset-50);dirty=false;selected=null;$('detail').hidden=true;await list()}});
$('next').onclick=()=>run(async()=>{if(nextOffset!==null&&await canLeave()){offset=nextOffset;dirty=false;selected=null;$('detail').hidden=true;await list()}});
$('logout').onclick=()=>run(async()=>{if(!await canLeave())return;try{await api('logout',{})}finally{endSession();msg('已登出')}});
$('paletteFile').onchange=()=>run(async()=>{publishData=null;$('publishBtn').disabled=true;$('pubPreview').textContent='';const f=$('paletteFile').files[0];if(!f)return;if(f.size>64000000)throw Error('備份檔過大');const d=JSON.parse(await f.text());if(!['MILUBANBAN-STUDIO-BACKUP-V44','MILUBANBAN-STUDIO-BACKUP-V47'].includes(d.format)||!Array.isArray(d.palette)||!d.geometry?.published)throw Error('請選擇完整工作室備份');publishData={palette:d.palette,geometry:d.geometry.published};$('pubPreview').textContent='顏料 '+d.palette.length+' 種，啟用 '+d.palette.filter(p=>p.enabled!==false).length+' 種，缺少編號 '+d.palette.filter(p=>p.enabled!==false&&!p.code).length+' 種。';$('publishBtn').disabled=false});
$('publishBtn').onclick=()=>run(async()=>{if(!publishData||role!=='owner'||!await ask('發布新版實體色票？','顧客將取得新的色票與版型；既有製作單保留原版本。','發布'))return;const d=await api('publish',publishData);$('pubPreview').textContent='發布成功，版本 '+d.version;publishData=null;$('publishBtn').disabled=true;msg('已發布新版色票')});
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
})();
</script></body></html>
